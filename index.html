<script>
  // 서비스워커: 이후부터는 이 워커가 모든 요청을 가로채서 항상 최신 파일을 강제로 받아온다.
  // (홈 화면 아이콘으로 켜는 경우까지 포함해서 근본적으로 캐시 문제를 해결)
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js').catch(function(){});
  }
  // 혹시 서비스워커가 아직 없거나 등록 전인 경우를 위한 보조 장치:
  // 백그라운드에서 복귀(bfcache)한 화면이면 한 번 더 강제 새로고침.
  window.addEventListener('pageshow', function(event) {
    if (event.persisted) {
      window.location.replace(window.location.pathname + '?_r=' + Date.now());
    }
  });
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
  :root {
    --paper: #F7F3EA; --paper-dim: #EFE9DA; --ink: #2B2A28; --ink-soft: #6B6660;
    --accent: #7B3B3B; --accent-soft: #B98A6F; --line: #D8D0BF;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", sans-serif; min-height: 100vh; }
  body {
    padding-bottom: 60px;
    background:
      radial-gradient(ellipse 90% 60% at 50% 0%, #FDFBF5 0%, var(--paper) 55%, #EFE7D6 100%);
    position: relative;
  }
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    opacity: 0.35; mix-blend-mode: multiply;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='matrix' values='0 0 0 0 0.16  0 0 0 0 0.15  0 0 0 0 0.13  0 0 0 0.05 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }
  .wrap { max-width: 480px; margin: 0 auto; padding: calc(max(env(safe-area-inset-top, 0px), 54px) + 22px) 20px 40px; position: relative; z-index: 1; }

  .app-title { text-align: center; font-family: "Noto Serif KR", serif; font-size: 15px; font-weight: 500; color: var(--ink); margin-bottom: 2px; }
  .app-tagline { text-align: center; font-family: "Noto Serif KR", serif; font-style: italic; font-size: 11.5px; color: var(--ink-soft); margin-bottom: 10px; opacity: 0.85; }
  .status-bar { text-align: center; font-size: 11px; color: var(--ink-soft); margin-bottom: 16px; }
  .status-bar.error { color: var(--accent); }

  .nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
  .nav button { background: none; border: none; color: var(--ink-soft); font-size: 22px; padding: 8px 14px; cursor: pointer; line-height: 1; }
  .nav button:active { color: var(--accent); }
  .date-block { text-align: center; flex: 1; }
  .date-year { font-family: "IBM Plex Mono", monospace; font-size: 12px; letter-spacing: 0.12em; color: var(--ink-soft); }
  .date-main { font-family: "Noto Serif KR", serif; font-weight: 700; font-size: 28px; margin: 3px 0 2px; letter-spacing: -0.01em; }
  .date-dow { font-size: 12px; color: var(--accent); letter-spacing: 0.08em; }
  .date-flourish { display: block; margin: 6px auto 0; opacity: 0.55; }
  .today-pill { display: inline-block; margin-top: 8px; font-size: 11px; color: var(--ink-soft); text-decoration: underline; cursor: pointer; }

  .jump-nav { display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  .jump-nav select {
    -webkit-appearance: none; appearance: none; border: 1px solid var(--line); background: white;
    border-radius: 8px; padding: 6px 22px 6px 10px; font-family: "IBM Plex Mono", monospace; font-size: 12.5px; color: var(--ink);
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 10 10'><path d='M1 3l4 4 4-4' fill='none' stroke='%236B6660' stroke-width='1.4'/></svg>");
    background-repeat: no-repeat; background-position: right 8px center;
  }
  .jump-nav .yr-jump { display: flex; gap: 4px; margin-left: 4px; }
  .jump-nav .yr-jump button { border: 1px solid var(--line); background: var(--paper-dim); color: var(--ink-soft);
    font-family: "IBM Plex Mono", monospace; font-size: 11px; padding: 5px 8px; border-radius: 8px; cursor: pointer; }
  .jump-nav .yr-jump button:active { background: var(--accent); color: var(--paper); border-color: var(--accent); }

  .card { background: white; border: 1px solid var(--line); border-radius: 14px; padding: 18px 18px 14px; margin-top: 22px; box-shadow: 0 1px 0 var(--line), 0 12px 24px -18px rgba(43,42,40,0.25);
    animation: riseIn 0.5s ease both; }
  .card-label { font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--accent); letter-spacing: 0.1em; margin-bottom: 10px; }
  .line-row { display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--line); padding: 9px 0; }
  .line-row:last-of-type { border-bottom: none; }
  .line-num { font-family: "IBM Plex Mono", monospace; font-size: 12px; color: var(--ink-soft); width: 14px; flex-shrink: 0; }
  .line-row input { flex: 1; border: none; outline: none; background: transparent; font-size: 15px; color: var(--ink); font-family: inherit; padding: 4px 0; transition: color 0.2s; }
  .line-row input::placeholder { color: #C9C2B2; font-style: italic; }
  .line-row input:focus { color: var(--accent); }

  .save-btn { width: 100%; margin-top: 14px; padding: 12px; border: none; border-radius: 10px; background: var(--accent); color: var(--paper); font-size: 14px; font-weight: 500; letter-spacing: 0.03em; cursor: pointer; transition: transform 0.15s ease, box-shadow 0.15s ease; }
  .save-btn:active { transform: scale(0.97); }
  .save-btn.saved { background: #4F6E56; }
  .save-status { text-align: center; font-size: 11px; color: var(--ink-soft); margin-top: 8px; min-height: 14px; }

  .section-title { font-family: "Noto Serif KR", serif; font-size: 15px; font-weight: 500; margin: 36px 0 4px; color: var(--ink); }
  .section-sub { font-size: 12px; color: var(--ink-soft); margin-bottom: 18px; font-style: italic; }
  .timeline { position: relative; }
  .rail { position: absolute; left: 20px; top: 6px; bottom: 6px; width: 1px;
    background: linear-gradient(to bottom, var(--accent-soft) 0%, var(--line) 55%, transparent 100%); }
  .entry { position: relative; padding-left: 44px; margin-bottom: 22px; animation: riseIn 0.5s ease both; }
  .entry-dot { position: absolute; left: 15px; top: 4px; width: 11px; height: 11px; border-radius: 50%; background: var(--paper); border: 2px solid var(--accent-soft); }
  .entry-year { font-family: "IBM Plex Mono", monospace; font-size: 12px; color: var(--accent); }
  .entry-ago { font-size: 11px; color: var(--ink-soft); margin-left: 6px; }
  .entry-lines p { font-family: "Noto Serif KR", serif; font-size: 14.5px; line-height: 1.65; margin: 4px 0 2px; color: var(--ink); }
  .empty { padding-left: 44px; font-size: 13px; color: var(--ink-soft); line-height: 1.7; font-style: italic; }

  @keyframes riseIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  @media (prefers-reduced-motion: reduce) { .card, .entry { animation: none; } }

  .footer-actions { display: flex; justify-content: center; flex-wrap: wrap; gap: 16px; margin-top: 40px; }
  .footer-actions button, .footer-actions span { background: none; border: none; font-size: 12px; color: var(--ink-soft); text-decoration: underline; cursor: pointer; }

  .modal-overlay { position: fixed; inset: 0; background: rgba(43,42,40,0.55); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 20px; overflow-y: auto; }
  .modal-box { background: var(--paper); border-radius: 16px; padding: 26px 22px; max-width: 360px; width: 100%; text-align: center; margin: auto; }
  .modal-box h3 { font-family: "Noto Serif KR", serif; font-size: 17px; margin: 0 0 8px; }
  .modal-box p { font-size: 12.5px; color: var(--ink-soft); margin: 0 0 14px; line-height: 1.5; text-align: left; }
  .modal-box label { display: block; font-size: 11px; color: var(--ink-soft); text-align: left; margin: 10px 0 4px; }
  .modal-box input { width: 100%; padding: 11px 12px; border: 1px solid var(--line); border-radius: 8px; font-size: 14px; font-family: inherit; }
  .modal-box button.primary { width: 100%; margin-top: 16px; padding: 12px; border: none; border-radius: 8px; background: var(--accent); color: var(--paper); font-size: 14px; cursor: pointer; }
  .modal-box button.secondary { width: 100%; margin-top: 8px; padding: 10px; border: none; background: none; color: var(--ink-soft); font-size: 12px; text-decoration: underline; cursor: pointer; }
</style>
</head>
<body>

<!-- 이름 입력 -->
<div class="modal-overlay" id="authorModal" style="display:none;">
  <div class="modal-box">

<!-- GitHub 연결 설정 -->
<div class="modal-overlay" id="ghModal" style="display:none;">
  <div class="modal-box">
    <h3>GitHub에 저장</h3>
    <p>일기 내용을 담을 <b>Private</b> 저장소 정보를 입력하세요. 여기 입력한 값은 이 기기에만 저장됩니다.</p>
    <label>Personal Access Token</label>

    <button class="secondary" id="ghModalClose">닫기</button>
  </div>

<script>
const STORAGE_PREFIX = 'diary3:';
const AUTHOR_KEY = 'diary3:author';
const GH_CONFIG_KEY = 'diary3:ghconfig';
const DOW = ['일','월','화','수','목','금','토'];

let selectedDate = new Date(); selectedDate.setHours(0,0,0,0);
let myAuthor = localStorage.getItem(AUTHOR_KEY) || '';
let ghConfig = null;
try { ghConfig = JSON.parse(localStorage.getItem(GH_CONFIG_KEY) || 'null'); } catch(e) { ghConfig = null; }
let ghSha = null; // 마지막으로 받아온 원격 파일의 sha (충돌 방지용)

function isoKey(d) { const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0'); return `${y}-${m}-${day}`; }
function mmdd(d) { return `${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function isSameDay(a,b){ return isoKey(a)===isoKey(b); }
function escapeHtml(str) { const div = document.createElement('div'); div.textContent = str; return div.innerHTML; }
function utf8ToB64(str) { return btoa(unescape(encodeURIComponent(str))); }
function b64ToUtf8(str) { return decodeURIComponent(escape(atob(str.replace(/\n/g,'')))); }

/* ---------- local cache (항상 사용, 오프라인 대비) ---------- */
function loadEntry(d) {
  const raw = localStorage.getItem(STORAGE_PREFIX + isoKey(d));
  if (!raw) return ['','',''];
  try { const arr = JSON.parse(raw); return [arr[0]||'', arr[1]||'', arr[2]||'']; } catch(e) { return ['','','']; }
}
function saveEntryLocal(d, lines) {
  const hasContent = lines.some(l => l.trim().length>0);
  const key = STORAGE_PREFIX + isoKey(d);
  if (hasContent) localStorage.setItem(key, JSON.stringify(lines));
  else localStorage.removeItem(key);
}
function allLocalEntries() {
  const out = {};
  for (let i=0; i<localStorage.length; i++) {
    const k = localStorage.key(i);
    if (k.startsWith(STORAGE_PREFIX)) {
      try { out[k.slice(STORAGE_PREFIX.length)] = JSON.parse(localStorage.getItem(k)); } catch(e) {}
    }
  }
  return out;
}
function replaceAllLocalEntries(obj) {
  // 기존 diary3: 항목 지우고 원격 데이터로 교체
  for (let i = localStorage.length - 1; i >= 0; i--) {
    const k = localStorage.key(i);
    if (k.startsWith(STORAGE_PREFIX) && k !== AUTHOR_KEY) localStorage.removeItem(k);
  }
  Object.keys(obj).forEach(dateKey => {
    localStorage.setItem(STORAGE_PREFIX + dateKey, JSON.stringify(obj[dateKey]));
  });
}

/* ---------- GitHub API ---------- */
function ghConfigured() { return ghConfig && ghConfig.token && ghConfig.owner && ghConfig.repo && ghConfig.path && ghConfig.branch; }
function ghUrl() { return `https://api.github.com/repos/${ghConfig.owner}/${ghConfig.repo}/contents/${encodeURIComponent(ghConfig.path)}`; }
function ghHeaders() { return { 'Authorization': `Bearer ${ghConfig.token}`, 'Accept': 'application/vnd.github+json' }; }

async function ghFetchAll() {
  const res = await fetch(`${ghUrl()}?ref=${encodeURIComponent(ghConfig.branch)}&_=${Date.now()}`, { headers: ghHeaders() });
  if (res.status === 404) { ghSha = null; return {}; }
  if (!res.ok) throw new Error('GitHub 읽기 실패: ' + res.status);
  const json = await res.json();
  ghSha = json.sha;
  return JSON.parse(b64ToUtf8(json.content));
}
async function ghSaveAll(dataObj) {
  const body = {
    message: `세 줄 업데이트 ${isoKey(new Date())}`,
    content: utf8ToB64(JSON.stringify(dataObj, null, 2)),
    branch: ghConfig.branch
  };
  if (ghSha) body.sha = ghSha;
  const res = await fetch(ghUrl(), { method: 'PUT', headers: { ...ghHeaders(), 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  if (!res.ok) {
    const errBody = await res.json().catch(()=>({}));
    throw new Error('GitHub 저장 실패: ' + res.status + ' ' + (errBody.message||''));
  }
  const json = await res.json();
  ghSha = json.content.sha;
}

function setStatus(text, isError) {
  document.getElementById('statusBar').textContent = text;
  document.getElementById('statusBar').className = 'status-bar' + (isError ? ' error' : '');
}

async function syncFromGithub() {
  if (!ghConfigured()) { setStatus('📴 이 기기에만 저장됩니다 (GitHub 미연결)'); return; }
  setStatus('☁️ GitHub에서 불러오는 중…');
  try {
    const remote = await ghFetchAll();
    replaceAllLocalEntries(remote);
    setStatus('☁️ GitHub와 연결됨');
  } catch (err) {
    console.error(err);
    setStatus('⚠️ GitHub 연결 실패 — 로컬 데이터로 표시 중', true);
  }
}

/* ---------- 이름 ---------- */
function ensureAuthor() {
  if (myAuthor) { updateWhoAmI(); return Promise.resolve(); }
  return new Promise(resolve => {
    document.getElementById('authorModal').style.display = 'flex';
    document.getElementById('authorConfirm').onclick = () => {
      const val = document.getElementById('authorInput').value.trim();
      if (!val) return;
      myAuthor = val; localStorage.setItem(AUTHOR_KEY, val);
      document.getElementById('authorModal').style.display = 'none';
      updateWhoAmI(); resolve();
    };
  });
}
function updateWhoAmI() {
  document.getElementById('appTitle').textContent = `${myAuthor}님의 세 줄 일기`;
  document.getElementById('whoAmI').textContent = `이름: ${myAuthor} (변경)`;
  document.getElementById('whoAmI').onclick = () => {
    document.getElementById('authorInput').value = myAuthor;
    document.getElementById('authorModal').style.display = 'flex';
    document.getElementById('authorConfirm').onclick = () => {
      const val = document.getElementById('authorInput').value.trim();
      if (!val) return;
      myAuthor = val; localStorage.setItem(AUTHOR_KEY, val);
      document.getElementById('authorModal').style.display = 'none';
      updateWhoAmI();
    };
  };
}

/* ---------- GitHub 설정 모달 ---------- */
function openGhModal() {
  if (ghConfig) {
    document.getElementById('ghToken').value = ghConfig.token || '';
    document.getElementById('ghOwner').value = ghConfig.owner || '';
    document.getElementById('ghRepo').value = ghConfig.repo || 'my-diary-data';
    document.getElementById('ghPath').value = ghConfig.path || 'entries.json';
    document.getElementById('ghBranch').value = ghConfig.branch || 'main';
  }
  document.getElementById('ghModal').style.display = 'flex';
}
document.getElementById('ghSettingsBtn').addEventListener('click', openGhModal);
document.getElementById('ghModalClose').addEventListener('click', () => { document.getElementById('ghModal').style.display = 'none'; });
document.getElementById('ghDisconnect').addEventListener('click', () => {
  ghConfig = null; localStorage.removeItem(GH_CONFIG_KEY);
  document.getElementById('ghModal').style.display = 'none';
  setStatus('📴 이 기기에만 저장됩니다 (GitHub 미연결)');
});
document.getElementById('ghSaveConfig').addEventListener('click', async () => {
  ghConfig = {
    token: document.getElementById('ghToken').value.trim(),
    owner: document.getElementById('ghOwner').value.trim(),
    repo: document.getElementById('ghRepo').value.trim() || 'my-diary-data',
    path: document.getElementById('ghPath').value.trim() || 'entries.json',
    branch: document.getElementById('ghBranch').value.trim() || 'main'
  };
  localStorage.setItem(GH_CONFIG_KEY, JSON.stringify(ghConfig));
  document.getElementById('ghModal').style.display = 'none';
  await syncFromGithub();
  render();
});

/* ---------- 연/월 이동 ---------- */
function daysInMonth(y, m) { return new Date(y, m, 0).getDate(); }
function jumpToYearMonth(year, month) {
  const day = Math.min(selectedDate.getDate(), daysInMonth(year, month));
  selectedDate = new Date(year, month - 1, day);
  render();
}
function populateSelectors() {
  const nowYear = new Date().getFullYear();
  const yearSelect = document.getElementById('yearSelect'); yearSelect.innerHTML = '';
  for (let y = nowYear - 25; y <= nowYear + 1; y++) { const opt = document.createElement('option'); opt.value = y; opt.textContent = y + '년'; yearSelect.appendChild(opt); }
  const monthSelect = document.getElementById('monthSelect'); monthSelect.innerHTML = '';
  for (let m = 1; m <= 12; m++) { const opt = document.createElement('option'); opt.value = m; opt.textContent = m + '월'; monthSelect.appendChild(opt); }
}
function syncSelectors() {
  document.getElementById('yearSelect').value = selectedDate.getFullYear();
  document.getElementById('monthSelect').value = selectedDate.getMonth() + 1;
}

/* ---------- 렌더 ---------- */
function render() {
  const today = new Date(); today.setHours(0,0,0,0);
  document.getElementById('dateYear').textContent = selectedDate.getFullYear() + '년';
  document.getElementById('dateMain').textContent = (selectedDate.getMonth()+1) + '월 ' + selectedDate.getDate() + '일';
  document.getElementById('dateDow').textContent = DOW[selectedDate.getDay()] + '요일';
  document.getElementById('todayPill').style.display = isSameDay(selectedDate, today) ? 'none' : 'inline-block';
  syncSelectors();

  const [l0,l1,l2] = loadEntry(selectedDate);
  document.getElementById('line0').value = l0;
  document.getElementById('line1').value = l1;
  document.getElementById('line2').value = l2;
  document.getElementById('saveStatus').textContent = '';

  renderTimeline();
}

function renderTimeline() {
  const container = document.getElementById('timeline');
  container.innerHTML = '';
  const targetMD = mmdd(selectedDate);
  const thisYear = selectedDate.getFullYear();
  const found = [];
  for (let y = thisYear - 1; y >= thisYear - 25; y--) {
    const [mm, dd] = targetMD.split('-').map(Number);
    const testDate = new Date(y, mm-1, dd);
    if (testDate.getMonth() !== mm-1) continue;
    const raw = localStorage.getItem(STORAGE_PREFIX + `${y}-${targetMD}`);
    if (raw) { try { found.push({ year: y, lines: JSON.parse(raw) }); } catch(e) {} }
  }
  if (found.length === 0) {
    container.innerHTML = `<div class="empty">아직 이 날의 기록이 없습니다.<br>내년 오늘, 여기서 오늘을 다시 만나게 됩니다.</div>`;
    return;
  }
  const rail = document.createElement('div'); rail.className = 'rail'; container.appendChild(rail);
  found.forEach((f, idx) => {
    const yearsAgo = thisYear - f.year;
    const fade = Math.max(0.4, 1 - yearsAgo * 0.09); // 오래된 기록일수록 옅어짐
    const el = document.createElement('div'); el.className = 'entry';
    el.style.animationDelay = (idx * 0.07) + 's';
    el.style.opacity = fade;
    const linesHtml = f.lines.filter(l=>l && l.trim()).map(l => `<p>${escapeHtml(l)}</p>`).join('');
    el.innerHTML = `<div class="entry-dot" style="border-color:${idx===0?'var(--accent-soft)':'var(--line)'}"></div><div class="entry-year">${f.year}년<span class="entry-ago">${yearsAgo}년 전</span></div><div class="entry-lines">${linesHtml || '<p style="color:var(--ink-soft)">(내용 없음)</p>'}</div>`;
    container.appendChild(el);
  });
}

/* ---------- 이벤트 ---------- */
document.getElementById('hardRefreshBtn').addEventListener('click', () => {
  const url = window.location.pathname + '?_r=' + Date.now();
  window.location.replace(url);
});
document.getElementById('prevBtn').addEventListener('click', () => { selectedDate.setDate(selectedDate.getDate()-1); render(); });
document.getElementById('nextBtn').addEventListener('click', () => { selectedDate.setDate(selectedDate.getDate()+1); render(); });
document.getElementById('todayPill').addEventListener('click', () => { selectedDate = new Date(); selectedDate.setHours(0,0,0,0); render(); });
document.getElementById('yearSelect').addEventListener('change', (e) => jumpToYearMonth(parseInt(e.target.value,10), selectedDate.getMonth()+1));
document.getElementById('monthSelect').addEventListener('change', (e) => jumpToYearMonth(selectedDate.getFullYear(), parseInt(e.target.value,10)));
document.getElementById('yrBack1').addEventListener('click', () => jumpToYearMonth(selectedDate.getFullYear()-1, selectedDate.getMonth()+1));
document.getElementById('yrBack2').addEventListener('click', () => jumpToYearMonth(selectedDate.getFullYear()-2, selectedDate.getMonth()+1));
document.getElementById('yrBack3').addEventListener('click', () => jumpToYearMonth(selectedDate.getFullYear()-3, selectedDate.getMonth()+1));

document.getElementById('saveBtn').addEventListener('click', async () => {
  const lines = [document.getElementById('line0').value, document.getElementById('line1').value, document.getElementById('line2').value];
  saveEntryLocal(selectedDate, lines);
  const status = document.getElementById('saveStatus');
  const btn = document.getElementById('saveBtn');
  renderTimeline();

  const flashSaved = (label) => {
    btn.textContent = '✓ 남겨졌습니다';
    btn.classList.add('saved');
    setTimeout(() => { btn.textContent = '저장'; btn.classList.remove('saved'); }, 1400);
    status.textContent = label;
  };

  if (!ghConfigured()) { flashSaved('저장되었습니다'); setTimeout(()=>{status.textContent='';}, 1800); return; }

  status.textContent = 'GitHub에 저장 중…';
  try {
    const remote = await ghFetchAll(); // 최신 sha + 다른 기기의 변경사항 반영
    const hasContent = lines.some(l => l.trim().length>0);
    if (hasContent) remote[isoKey(selectedDate)] = lines; else delete remote[isoKey(selectedDate)];
    replaceAllLocalEntries(remote);
    await ghSaveAll(remote);
    flashSaved('저장되었습니다 (GitHub 동기화 완료)');
    setStatus('☁️ GitHub와 연결됨');
  } catch (err) {
    console.error(err);
    status.textContent = '로컬엔 저장됨 · GitHub 동기화 실패';
    setStatus('⚠️ GitHub 동기화 실패', true);
  }
  setTimeout(()=>{ status.textContent=''; }, 2400);
});

document.getElementById('exportBtn').addEventListener('click', () => {
  const data = allLocalEntries();
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = `diary-backup-${myAuthor||'me'}-${isoKey(new Date())}.json`; a.click();
  URL.revokeObjectURL(url);
});
document.getElementById('importBtn').addEventListener('click', () => document.getElementById('importFile').click());
document.getElementById('importFile').addEventListener('change', (e) => {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = (evt) => {
    try {
      const data = JSON.parse(evt.target.result);
      Object.keys(data).forEach(k => localStorage.setItem(STORAGE_PREFIX + k, JSON.stringify(data[k])));
      alert('가져오기가 완료되었습니다.');
      render();
    } catch(err) { alert('파일을 읽을 수 없습니다.'); }
  };
  reader.readAsText(file);
});

/* ---------- 시작 ---------- */
populateSelectors();
ensureAuthor().then(async () => {
  render();
  await syncFromGithub();
  render();
});
</script>
