<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>세 줄 일기</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="세줄일기">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#F7F3EA">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F7F3EA;
    --paper-dim: #EFE9DA;
    --ink: #2B2A28;
    --ink-soft: #6B6660;
    --accent: #7B3B3B;
    --accent-soft: #B98A6F;
    --line: #D8D0BF;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", sans-serif;
    min-height: 100vh;
  }
  body {
    padding-bottom: 60px;
  }
  .wrap {
    max-width: 480px;
    margin: 0 auto;
    padding: 24px 20px 40px;
  }

  /* ---- header / date nav ---- */
  .nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 4px;
  }
  .nav button {
    background: none;
    border: none;
    color: var(--ink-soft);
    font-size: 22px;
    padding: 8px 14px;
    cursor: pointer;
    line-height: 1;
  }
  .nav button:active { color: var(--accent); }
  .date-block { text-align: center; flex: 1; }
  .date-year {
    font-family: "IBM Plex Mono", monospace;
    font-size: 12px;
    letter-spacing: 0.12em;
    color: var(--ink-soft);
  }
  .date-main {
    font-family: "Noto Serif KR", serif;
    font-weight: 700;
    font-size: 26px;
    margin: 2px 0;
  }
  .date-dow {
    font-size: 12px;
    color: var(--accent);
    letter-spacing: 0.08em;
  }
  .today-pill {
    display: inline-block;
    margin-top: 6px;
    font-size: 11px;
    color: var(--ink-soft);
    text-decoration: underline;
    cursor: pointer;
  }

  /* ---- entry card ---- */
  .card {
    background: white;
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 18px 18px 14px;
    margin-top: 22px;
    box-shadow: 0 1px 0 var(--line);
  }
  .card-label {
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px;
    color: var(--accent);
    letter-spacing: 0.1em;
    margin-bottom: 10px;
  }
  .line-row {
    display: flex;
    align-items: center;
    gap: 10px;
    border-bottom: 1px solid var(--line);
    padding: 9px 0;
  }
  .line-row:last-of-type { border-bottom: none; }
  .line-num {
    font-family: "IBM Plex Mono", monospace;
    font-size: 12px;
    color: var(--ink-soft);
    width: 14px;
    flex-shrink: 0;
  }
  .line-row input {
    flex: 1;
    border: none;
    outline: none;
    background: transparent;
    font-size: 15px;
    color: var(--ink);
    font-family: inherit;
    padding: 4px 0;
  }
  .line-row input::placeholder { color: #C9C2B2; }

  .save-btn {
    width: 100%;
    margin-top: 14px;
    padding: 12px;
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: var(--paper);
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 0.03em;
    cursor: pointer;
  }
  .save-btn:active { opacity: 0.85; }
  .save-status {
    text-align: center;
    font-size: 11px;
    color: var(--ink-soft);
    margin-top: 8px;
    min-height: 14px;
  }

  /* ---- past entries timeline ---- */
  .section-title {
    font-family: "Noto Serif KR", serif;
    font-size: 15px;
    font-weight: 500;
    margin: 34px 0 4px;
    color: var(--ink);
  }
  .section-sub {
    font-size: 12px;
    color: var(--ink-soft);
    margin-bottom: 16px;
  }
  .timeline { position: relative; }
  .rail {
    position: absolute;
    left: 20px;
    top: 6px;
    bottom: 6px;
    width: 1px;
    background: var(--line);
  }
  .entry {
    position: relative;
    padding-left: 44px;
    margin-bottom: 20px;
  }
  .entry-dot {
    position: absolute;
    left: 15px;
    top: 4px;
    width: 11px;
    height: 11px;
    border-radius: 50%;
    background: var(--paper);
    border: 2px solid var(--accent-soft);
  }
  .entry-year {
    font-family: "IBM Plex Mono", monospace;
    font-size: 12px;
    color: var(--accent);
    margin-bottom: 4px;
  }
  .entry-ago {
    font-size: 11px;
    color: var(--ink-soft);
    margin-left: 6px;
  }
  .entry-lines p {
    font-family: "Noto Serif KR", serif;
    font-size: 14.5px;
    line-height: 1.6;
    margin: 0 0 2px;
    color: var(--ink);
  }
  .empty {
    padding-left: 44px;
    font-size: 13px;
    color: var(--ink-soft);
    line-height: 1.6;
  }

  .footer-actions {
    display: flex;
    justify-content: center;
    gap: 18px;
    margin-top: 40px;
  }
  .footer-actions button {
    background: none;
    border: none;
    font-size: 12px;
    color: var(--ink-soft);
    text-decoration: underline;
    cursor: pointer;
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="nav">
    <button id="prevBtn" aria-label="이전 날">‹</button>
    <div class="date-block">
      <div class="date-year" id="dateYear"></div>
      <div class="date-main" id="dateMain"></div>
      <div class="date-dow" id="dateDow"></div>
      <div class="today-pill" id="todayPill">오늘로</div>
    </div>
    <button id="nextBtn" aria-label="다음 날">›</button>
  </div>

  <div class="card">
    <div class="card-label">이 날의 세 줄</div>
    <div class="line-row">
      <span class="line-num">1</span>
      <input type="text" maxlength="80" id="line0" placeholder="오늘 있었던 일">
    </div>
    <div class="line-row">
      <span class="line-num">2</span>
      <input type="text" maxlength="80" id="line1" placeholder="오늘의 기분이나 생각">
    </div>
    <div class="line-row">
      <span class="line-num">3</span>
      <input type="text" maxlength="80" id="line2" placeholder="내일 기억하고 싶은 것">
    </div>
    <button class="save-btn" id="saveBtn">저장</button>
    <div class="save-status" id="saveStatus"></div>
  </div>

  <div class="section-title">이 날의 기록</div>
  <div class="section-sub" id="pastSub">지난 해 같은 날엔 무슨 일이 있었을까요</div>
  <div class="timeline" id="timeline"></div>

  <div class="footer-actions">
    <button id="exportBtn">백업 내보내기</button>
    <button id="importBtn">가져오기</button>
  </div>
  <input type="file" id="importFile" accept="application/json" style="display:none">

</div>

<script>
const STORAGE_PREFIX = 'diary3:';
const DOW = ['일','월','화','수','목','금','토'];

let selectedDate = new Date();
selectedDate.setHours(0,0,0,0);

function isoKey(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function mmdd(d) {
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${m}-${day}`;
}
function isSameDay(a,b){ return isoKey(a)===isoKey(b); }

function loadEntry(d) {
  const raw = localStorage.getItem(STORAGE_PREFIX + isoKey(d));
  if (!raw) return ['','',''];
  try {
    const arr = JSON.parse(raw);
    return [arr[0]||'', arr[1]||'', arr[2]||''];
  } catch(e) { return ['','','']; }
}
function saveEntry(d, lines) {
  const hasContent = lines.some(l => l.trim().length>0);
  const key = STORAGE_PREFIX + isoKey(d);
  if (hasContent) {
    localStorage.setItem(key, JSON.stringify(lines));
  } else {
    localStorage.removeItem(key);
  }
}

function render() {
  const today = new Date(); today.setHours(0,0,0,0);
  document.getElementById('dateYear').textContent = selectedDate.getFullYear() + '년';
  document.getElementById('dateMain').textContent =
    (selectedDate.getMonth()+1) + '월 ' + selectedDate.getDate() + '일';
  document.getElementById('dateDow').textContent = DOW[selectedDate.getDay()] + '요일';
  document.getElementById('todayPill').style.display = isSameDay(selectedDate, today) ? 'none' : 'inline-block';

  const [l0,l1,l2] = loadEntry(selectedDate);
  document.getElementById('line0').value = l0;
  document.getElementById('line1').value = l1;
  document.getElementById('line2').value = l2;
  document.getElementById('saveStatus').textContent = '';

  renderTimeline();
}

function renderTimeline() {
  const container = document.getElementById('timeline');
  container.innerHTML = '';
  const targetMD = mmdd(selectedDate);
  const thisYear = selectedDate.getFullYear();
  const found = [];

  for (let y = thisYear - 1; y >= thisYear - 20; y--) {
    // handle Feb 29 gracefully by skipping if invalid
    const [mm, dd] = targetMD.split('-').map(Number);
    const testDate = new Date(y, mm-1, dd);
    if (testDate.getMonth() !== mm-1) continue; // invalid date (e.g. leap day)
    const key = `${y}-${targetMD}`;
    const raw = localStorage.getItem(STORAGE_PREFIX + key);
    if (raw) {
      try {
        const arr = JSON.parse(raw);
        found.push({ year: y, lines: arr });
      } catch(e) {}
    }
  }

  if (found.length === 0) {
    container.innerHTML = `<div class="empty">아직 이 날의 기록이 없습니다.<br>내년 오늘, 여기서 오늘을 다시 만나게 됩니다.</div>`;
    return;
  }

  const rail = document.createElement('div');
  rail.className = 'rail';
  container.appendChild(rail);

  found.forEach(f => {
    const yearsAgo = thisYear - f.year;
    const el = document.createElement('div');
    el.className = 'entry';
    const linesHtml = f.lines.filter(l=>l && l.trim()).map(l => `<p>${escapeHtml(l)}</p>`).join('');
    el.innerHTML = `
      <div class="entry-dot"></div>
      <div class="entry-year">${f.year}년<span class="entry-ago">${yearsAgo}년 전</span></div>
      <div class="entry-lines">${linesHtml || '<p style="color:var(--ink-soft)">(내용 없음)</p>'}</div>
    `;
    container.appendChild(el);
  });
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

document.getElementById('prevBtn').addEventListener('click', () => {
  selectedDate.setDate(selectedDate.getDate()-1);
  render();
});
document.getElementById('nextBtn').addEventListener('click', () => {
  selectedDate.setDate(selectedDate.getDate()+1);
  render();
});
document.getElementById('todayPill').addEventListener('click', () => {
  selectedDate = new Date(); selectedDate.setHours(0,0,0,0);
  render();
});
document.getElementById('saveBtn').addEventListener('click', () => {
  const lines = [
    document.getElementById('line0').value,
    document.getElementById('line1').value,
    document.getElementById('line2').value
  ];
  saveEntry(selectedDate, lines);
  const status = document.getElementById('saveStatus');
  status.textContent = '저장되었습니다';
  setTimeout(()=>{ status.textContent=''; }, 1800);
  renderTimeline();
});

// backup export / import
document.getElementById('exportBtn').addEventListener('click', () => {
  const data = {};
  for (let i=0; i<localStorage.length; i++) {
    const k = localStorage.key(i);
    if (k.startsWith(STORAGE_PREFIX)) data[k] = localStorage.getItem(k);
  }
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `diary-backup-${isoKey(new Date())}.json`;
  a.click();
  URL.revokeObjectURL(url);
});
document.getElementById('importBtn').addEventListener('click', () => {
  document.getElementById('importFile').click();
});
document.getElementById('importFile').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (evt) => {
    try {
      const data = JSON.parse(evt.target.result);
      Object.keys(data).forEach(k => {
        if (k.startsWith(STORAGE_PREFIX)) localStorage.setItem(k, data[k]);
      });
      alert('가져오기가 완료되었습니다.');
      render();
    } catch(err) {
      alert('파일을 읽을 수 없습니다.');
    }
  };
  reader.readAsText(file);
});

render();
</script>
</body>
</html>
